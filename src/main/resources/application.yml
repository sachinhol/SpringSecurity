server:
  port: 8084

spring:
  application:
    name: AUTH-SERVICE
    
    
  datasource:
    url: jdbc:mysql://localhost:3306/user_db
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8010/eureka
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true

jwt:
  secret: bW9uZXlrZXlzLXJ1bGUtam90YS1zZWNyZXQtMTIzNDU2
  expiration: 3600000

