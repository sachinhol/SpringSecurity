server:
  port: 8082



spring:
  application:
    name: Order-Service

  datasource:
    url: jdbc:mysql://localhost:3306/orderdb
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update


eureka:
  client:
    service-url:
      defaultZone: http://localhost:8010/eureka
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true
